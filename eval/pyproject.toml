[project]
name = "pdf2docx-eval"
version = "0.1.0"
description = "Round-trip evaluation harness for the pdf2docx fork"
requires-python = ">=3.11"
dependencies = [
    "pdf2docx",
]

[tool.uv.sources]
pdf2docx = { path = "..", editable = true }

[dependency-groups]
eval = [
    "scikit-image>=0.26.0",
]
